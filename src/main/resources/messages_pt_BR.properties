index.sobre.primeiro.paragrafo=Meu interesse por programa\u00E7\u00E3o come\u00E7ou na adolesc\u00EAncia, quando ganhei meu primeiro computador. Entre horas jogando Club Penguin e Minecraft, surgiu a curiosidade sobre o que acontecia por tr\u00E1s da tela e como os sistemas realmente funcionavam. Foi nesse momento que a tecnologia deixou de ser apenas entretenimento e passou a ser uma dire\u00E7\u00E3o.
index.sobre.segundo.paragrafo=Antes da faculdade, eu me pegava tentando entender como n\u00FAmeros bin\u00E1rios se transformavam em imagens, como um site era constru\u00EDdo ou o que exatamente era a nuvem. Com o tempo, essas perguntas evolu\u00EDram para conceitos mais profundos como APIs, frameworks e deploys, e foi a\u00ED que percebi que queria construir solu\u00E7\u00F5es de verdade.
index.sobre.terceiro.paragrafo=Hoje atuo como desenvolvedor full-stack h\u00E1 pouco mais de tr\u00EAs anos e sigo genuinamente apaixonado pela \u00E1rea. Ao longo da minha trajet\u00F3ria, trabalhei com Python e C, mas minha principal experi\u00EAncia profissional \u00E9 com Java, com uso mais recente de Kotlin. Nesse caminho, aprendi que o conhecimento n\u00E3o tem fim, apenas evolu\u00E7\u00E3o constante.
index.sobre.quarto.paragrafo=Sigo buscando novos desafios e transformando curiosidade em solu\u00E7\u00F5es atrav\u00E9s da tecnologia.

index.experiencia.terceira.titulo=Invillia
index.experiencia.terceira.texto=Atuando como Desenvolvedor Back-end no setor de investimentos do PagBank, com foco em concilia\u00E7\u00E3o financeira. Experi\u00EAncia no desenvolvimento e evolu\u00E7\u00E3o de microsservi\u00E7os utilizando Kotlin e Spring, al\u00E9m da constru\u00E7\u00E3o de pipelines de deploy com Jenkins. Atua\u00E7\u00E3o com conteineriza\u00E7\u00E3o utilizando Docker, monitoramento e an\u00E1lise de logs com Splunk, e gest\u00E3o de dados com OracleDB aliado ao uso de Redis para estrat\u00E9gias de cache, garantindo performance e confiabilidade nas aplica\u00E7\u00F5es.
index.experiencia.segunda.titulo=Gil Sistemas
index.experiencia.segunda.texto=Respons\u00E1vel pela manuten\u00E7\u00E3o e evolu\u00E7\u00E3o de dois servi\u00E7os pr\u00E9-existentes: um desenvolvido em Java com Spring Boot, seguindo os padr\u00F5es de arquitetura Hexagonal, e outro em Java utilizando a plataforma WebSphere, numa arquitetura de microsservi\u00E7os. Ambos os servi\u00E7os utilizavam bases de dados relacionais.

index.experiencia.primeira.titulo=Dev4Cloud
index.experiencia.primeira.texto=Respons\u00E1vel por projetar e desenvolver solu\u00E7\u00F5es para aplica\u00E7\u00F5es web responsivas utilizando Java com Spring Boot e Groovy com Grails, al\u00E9m de algumas APIs RESTful para diversos clientes. Grande parte dos projetos utilizava arquitetura de microsservi\u00E7os com RabbitMQ.

index.experiencia.freelancer.titulo=Freelancer
index.experiencia.freelancer.texto=Respons\u00E1vel pela cria\u00E7\u00E3o de websites responsivos utilizando HTML, CSS e JavaScript, com back-end majoritariamente desenvolvido em Java, utilizando o framework Spring Boot. Tamb\u00E9m tive contato com a cria\u00E7\u00E3o de sites com WordPress.